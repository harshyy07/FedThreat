[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedthreat"
version = "0.3.0"
description = "Federated Learning Framework for Cross-Organization Threat Detection"
authors = [{ name = "FedThreat Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]   # only needed for ThreatMLP/ClientTrainer and the simulation harness
fl = [
    "flwr>=1.7.0",
    "opacus>=1.4.0",
]
dev = [
    "pytest>=7.0.0",
    "dp-accounting>=0.4",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["threat_detection_model_v3", ".git", ".pytest_cache"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
